<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: page.excerpt | default: site.description | strip_html | strip_newlines | truncate: 160 }}">
<meta property="og:title" content="{{ page.title | default: site.title }}">
<meta property="og:image" content="{{ site.url }}{{ page.image | default: '/share.jpg' }}">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/logo-mark.jpg">
{% feed_meta %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#0f1d31;--navy2:#16283f;--navy3:#1d3350;--line-d:rgba(255,255,255,.10);--paper:#f6f4ef;--line:#e4e0d6;--ink:#1a2332;--muted:#5d6878;--muted-d:#a9b4c4;--gold:#c9a45c;--gold2:#e0c285}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:Inter,system-ui,sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:600;line-height:1.15;letter-spacing:-.01em}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.narrow{max-width:720px;margin:0 auto;padding:0 24px}
nav{position:sticky;top:0;z-index:20;background:rgba(15,29,49,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line-d);color:#fff}
nav .wrap{display:flex;align-items:center;justify-content:space-between;height:70px;gap:12px}
.brand{display:flex;align-items:center;gap:12px;font-weight:600}
.brand img{width:40px;height:40px;border-radius:8px;object-fit:cover;background:#fff}
.nav-links{display:flex;gap:30px;font-size:.9rem;color:var(--muted-d)}
.nav-links a:hover,.nav-links a.on{color:#fff}
.head{background:linear-gradient(135deg,var(--navy) 0%,var(--navy2) 60%,var(--navy3) 100%);color:#fff;padding:64px 0 56px}
.label{display:inline-flex;align-items:center;gap:10px;color:var(--gold);font-size:.78rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;margin-bottom:14px}
.label::before{content:"";width:28px;height:1px;background:currentColor}
.head h1{font-size:clamp(2rem,4.6vw,3.2rem);margin-bottom:12px}
.head p{color:#cfd7e3}
main{padding:56px 0 80px}
footer{background:#0b1626;color:var(--muted-d);font-size:.88rem;padding:30px 0}
footer .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
footer a:hover{color:var(--gold2)}
@media(max-width:560px){.nav-links{gap:18px}}
</style>
</head>
<body>
<nav>
  <div class="wrap">
    <a href="/" class="brand"><img src="/logo-mark.jpg" alt="AI Gurukool">AI Gurukool</a>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/resources/">Free Guides</a>
      <a href="/posts/" class="on">Posts</a>
    </div>
  </div>
</nav>
{{ content }}
<footer>
  <div class="wrap">
    <a href="/">aigurukool.in</a>
    <div>&copy; {{ site.time | date: "%Y" }} AI Gurukool</div>
  </div>
</footer>
<script src="/assets/aig.js" defer></script>
</body>
</html>
