<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Baloo;src:url(../thumb/baloo-2-latin-800-normal.woff2) format('woff2');font-weight:800}
@font-face{font-family:Baloo;src:url(../thumb/baloo-2-latin-700-normal.woff2) format('woff2');font-weight:700}
html,body{margin:0}
.b{width:1200px;height:420px;position:relative;overflow:hidden;
  background:url(../thumb/art/bg-gold.jpg) center/cover;font-family:Baloo,sans-serif}
.b:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(15,29,49,.96) 0%,rgba(15,29,49,.88) 55%,rgba(15,29,49,.2) 100%)}
.logo{position:absolute;left:70px;top:70px;width:170px;height:159px;border-radius:22px;background:#fff;
  box-shadow:0 10px 30px rgba(0,0,0,.35);overflow:hidden}
.logo img{width:100%;height:100%;object-fit:contain}
.t{position:absolute;left:280px;top:72px;color:#fff}
.t h1{margin:0;font-size:86px;line-height:1;font-weight:800;letter-spacing:.5px}
.t h1 span{color:#c9a45c}
.t p{margin:14px 0 0;font-size:34px;font-weight:700;color:#e8dcc0}
.tag{position:absolute;left:70px;bottom:62px;background:#c9a45c;color:#0f1d31;font-weight:800;
  font-size:30px;padding:10px 26px;border-radius:40px}
.m{position:absolute;right:20px;bottom:-30px;height:470px}
</style></head><body>
<div class="b">
  <div class="logo"><img src="../../logo.jpg"></div>
  <div class="t"><h1>AI <span>Gurukool</span></h1><p>AI aur automation, Hinglish mein</p></div>
  <div class="tag">Aapka AI News Update</div>
  <img class="m" src="../thumb/art/mascot-wave.png">
</div>
</body></html>
