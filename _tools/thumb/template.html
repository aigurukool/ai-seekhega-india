<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face{font-family:Anton;src:url(anton-latin-400-normal.woff2)}
@font-face{font-family:Baloo;src:url(baloo-2-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:Baloo;src:url(baloo-2-latin-800-normal.woff2);font-weight:800}
/* Themes: one accent pair per background */
body.fire{--a1:#ffd23f;--a2:#ff6a00;--glow:rgba(255,120,20,.75);--deep:#7a1e00}
body.neon{--a1:#5ff2ff;--a2:#c25cff;--glow:rgba(140,90,255,.8);--deep:#2a0a6b}
body.gold{--a1:#ffe08a;--a2:#ffae2b;--glow:rgba(255,190,60,.7);--deep:#5a3a00}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1600px;height:900px;overflow:hidden;background:#000}
body{position:relative;font-family:Baloo,sans-serif;color:#fff}
.bg{position:absolute;inset:0;background-size:cover;background-position:center 70%}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.72) 0%,rgba(0,0,0,.35) 48%,rgba(0,0,0,0) 70%),linear-gradient(0deg,rgba(0,0,0,.55) 0%,transparent 22%)}
.bot{position:absolute;right:30px;bottom:56px;height:770px;filter:drop-shadow(0 0 34px var(--glow)) drop-shadow(0 30px 30px rgba(0,0,0,.6))}
.left{position:absolute;left:70px;top:58px;width:940px}
.tag{display:inline-block;font-family:Anton,sans-serif;font-size:46px;letter-spacing:1px;padding:4px 26px;border-radius:14px;background:#0b0b0b;border:4px solid var(--a1);color:#fff;transform:rotate(-4deg);box-shadow:0 0 24px var(--glow)}
.tag b{color:var(--a1);font-weight:400}
h1{margin-top:22px;font-family:Anton,sans-serif;font-weight:400;text-transform:uppercase;line-height:.95;letter-spacing:1px}
h1 .row{display:block;width:max-content;white-space:nowrap}
.l1{font-size:150px;color:#fff;
  text-shadow:0 2px 0 #cfd6e0,0 4px 0 #aeb7c4,0 6px 0 #8c96a6,0 8px 0 #6c7586,0 10px 0 #4e5666,0 14px 18px rgba(0,0,0,.7),0 0 40px rgba(255,255,255,.25)}
.l2wrap{position:relative;display:inline-block}
.l2{font-size:180px;background:linear-gradient(180deg,var(--a1) 15%,var(--a2) 85%);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:3px rgba(255,255,255,.55);position:relative;z-index:1}
.l2shadow{position:absolute;left:0;top:0;font-size:180px;color:var(--deep);z-index:0;
  text-shadow:0 2px 0 var(--deep),0 4px 0 var(--deep),0 6px 0 var(--deep),0 8px 0 var(--deep),0 10px 0 var(--deep),0 12px 0 var(--deep),0 16px 24px rgba(0,0,0,.8),0 0 60px var(--glow)}
.pre{font-family:Baloo,sans-serif;font-weight:800;font-size:88px;color:#fff;text-transform:none;margin-right:20px;text-shadow:0 6px 0 rgba(0,0,0,.5),0 0 30px var(--glow);vertical-align:18px}
.sub{margin-top:26px;display:inline-block;font-weight:800;font-size:44px;line-height:1.2;color:#111;padding:10px 30px 4px;background:linear-gradient(90deg,var(--a1),var(--a2));border-radius:12px;transform:skewX(-8deg);box-shadow:0 10px 0 rgba(0,0,0,.45),0 0 30px var(--glow)}
.sub span{display:inline-block;transform:skewX(8deg)}
.chips{margin-top:30px;display:flex;gap:16px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:12px;padding:10px 20px 6px 12px;border-radius:999px;background:rgba(10,10,20,.62);border:2px solid rgba(255,255,255,.18);font-weight:800;font-size:32px;backdrop-filter:blur(6px)}
.chip i{font-style:normal;display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:linear-gradient(180deg,var(--a1),var(--a2));color:#111;font-size:28px;padding-top:4px}
.foot{position:absolute;left:0;right:0;bottom:22px;display:flex;align-items:center;justify-content:center;gap:26px;font-family:Anton,sans-serif;font-size:34px;letter-spacing:7px}
.foot::before,.foot::after{content:"";height:3px;width:280px;background:linear-gradient(90deg,transparent,var(--a2))}
.foot::after{transform:scaleX(-1)}
.foot em{font-style:normal;color:var(--a2)}
</style>
</head>
<body class="fire">
<div class="bg" id="bg"></div>
<div class="shade"></div>
<img class="bot" id="bot" alt="">
<div class="left">
  <div class="tag" id="tag">NAYA <b>POST</b></div>
  <h1>
    <span class="row l1" id="l1"></span>
    <span class="row"><span class="pre" id="pre"></span><span class="l2wrap"><span class="l2shadow" id="l2s"></span><span class="l2" id="l2"></span></span></span>
  </h1>
  <div class="sub" id="subw"><span id="sub"></span></div>
  <div class="chips" id="chips"></div>
</div>
<div class="foot">AI AUTOMATION KI ABC <em>BY AI GURUKOOL</em></div>
<script>
const D = Object.assign({theme:"fire", pose:"point", tag:"NAYA POST", l1:"", pre:"", l2:"", sub:"", chips:[]}, window.THUMB || {});
document.body.className = D.theme;
document.getElementById("bg").style.backgroundImage = "url(art/bg-" + D.theme + ".jpg)";
document.getElementById("bot").src = "art/mascot-" + D.pose + ".png";
const tagWords = D.tag.split(" "); const last = tagWords.pop();
const tag = document.getElementById("tag"); tag.textContent = tagWords.join(" ") + (tagWords.length ? " " : "");
const b = document.createElement("b"); b.textContent = last; tag.appendChild(b);
document.getElementById("l1").textContent = D.l1;
document.getElementById("pre").textContent = D.pre;
document.getElementById("l2").textContent = D.l2;
document.getElementById("l2s").textContent = D.l2;
document.getElementById("sub").textContent = D.sub;
if (!D.l1) document.getElementById("l1").style.display = "none";
if (!D.pre) document.getElementById("pre").style.display = "none";
if (!D.sub) document.getElementById("subw").style.display = "none";
const chips = document.getElementById("chips");
(D.chips || []).slice(0, 6).forEach((c, i) => {
  const d = document.createElement("div"); d.className = "chip";
  d.innerHTML = "<i>" + (i + 1) + "</i><span></span>"; d.querySelector("span").textContent = c; chips.appendChild(d);
});
/* Shrink headline rows until they fit the text column */
const MAX = 900;
const l1 = document.getElementById("l1");
let s = 150; while (l1.offsetWidth > MAX && s > 70) { s -= 4; l1.style.fontSize = s + "px"; }
const row2 = document.getElementById("l2").closest(".row");
let s2 = 180; while (row2.offsetWidth > MAX && s2 > 80) { s2 -= 4; for (const id of ["l2","l2s"]) document.getElementById(id).style.fontSize = s2 + "px"; }
</script>
</body>
</html>
